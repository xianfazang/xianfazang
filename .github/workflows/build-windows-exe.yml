name: Build Windows EXE

on:
  push:
    branches:
      - "cursor/phase0-*"
      - "cursor/phase0-windows-exe-*"
    paths:
      - "dynamometer-host/**"
      - ".github/workflows/build-windows-exe.yml"
  pull_request:
    paths:
      - "dynamometer-host/**"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            dynamometer-host/requirements.txt
            dynamometer-host/requirements-build.txt

      - name: Install dependencies
        working-directory: dynamometer-host
        shell: pwsh
        run: |
          python -m pip install -U pip wheel
          pip install -r requirements.txt
          pip install -e .
          pip install -r requirements-build.txt

      - name: Smoke (headless)
        working-directory: dynamometer-host
        shell: pwsh
        run: |
          python -m dynamometer_host --smoke
          pytest -q

      - name: Build exe with PyInstaller
        working-directory: dynamometer-host
        shell: pwsh
        run: |
          pyinstaller build_exe.spec --noconfirm --clean
          if (-not (Test-Path -LiteralPath "dist\测功机上位机.exe")) {
            Get-ChildItem -Recurse dist | Format-Table FullName, Length
            throw "PyInstaller did not produce dist\测功机上位机.exe"
          }

      - name: Zip for download
        working-directory: dynamometer-host
        shell: pwsh
        run: |
          .\scripts\package_windows_zip.ps1

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: 测功机上位机-Mock
          path: dynamometer-host/dist/测功机上位机-Mock.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        # Stable download link for non-technical users (Actions artifacts expire).
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phase0-mock-ui-v0.1.0
          name: 测功机上位机 Phase 0 Mock（双击运行）
          body: |
            Phase 0 Mock 上位机 Windows 可执行文件。

            **使用方法**
            1. 下载下方的 `测功机上位机-Mock.zip`
            2. 解压
            3. 双击 `测功机上位机.exe`

            若杀毒软件提示未知来源，可选择「仍要运行」（未做代码签名的常见提示）。
          files: dynamometer-host/dist/测功机上位机-Mock.zip
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
